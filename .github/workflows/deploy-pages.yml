# Publishes the Vite build to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Site: https://ycortes94.github.io/TestStore/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Project site path. github.event.repository.name keeps this in sync if the repo is renamed.
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Client-side SDK keys are baked into the bundle at build time.
          # Create under Repo → Settings → Secrets and variables → Actions
          VITE_STATSIG_CLIENT_KEY: ${{ secrets.VITE_STATSIG_CLIENT_KEY }}
          VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
          VITE_STATSIG_TIER: production

      # Pages has no SPA rewrite. Serving the app as the 404 keeps /product/:id and /profile
      # working when someone opens or refreshes those URLs.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
