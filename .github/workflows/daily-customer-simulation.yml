# Runs the Playwright “customer simulation” several times daily in Pacific time
# (America/Los_Angeles — handles PST/PDT). See:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onschedule
#
# Schedule (Pacific): 8:00, 9:30, 14:00, 17:00 (5 PM), 20:00 (8 PM).
#
# Scheduling notes:
# - Runs only from the repository DEFAULT branch (merge this file to main/master).
# - GitHub may delay scheduled runs during high load (not wall-clock exact).
# - Forks: scheduled workflows are disabled unless you enable Actions.
# - Manual test: Actions → this workflow → “Run workflow”.
name: Daily customer simulation

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/Los_Angeles
    - cron: '30 9 * * *'
      timezone: America/Los_Angeles
    - cron: '0 14 * * *'
      timezone: America/Los_Angeles
    - cron: '0 17 * * *'
      timezone: America/Los_Angeles
    - cron: '0 20 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

# Do not cancel an in-progress run when the next schedule fires.
concurrency:
  group: daily-customer-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    # ~3× matrix (desktop + android + ios device projects); leave headroom for retries.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run customer simulation
        run: npm run simulate-customers
        env:
          CI: true
          # Per platform (desktop / android / ios) → ~300 experiment visitors total.
          SIM_EXPERIMENT_USERS: '100'
          VITE_STATSIG_TIER: production
          # Local sim script defaults to 16 workers; GitHub-hosted runners stay at 2.
          PLAYWRIGHT_WORKERS: '2'
          # Keep pacing human-like but leave headroom under the 180s experiment timeout.
          PLAYWRIGHT_SLOW_MO: '80'
          SIM_HUMAN_MIN_MS: '280'
          SIM_HUMAN_MAX_MS: '700'
          # Create under Repo → Settings → Secrets and variables → Actions
          VITE_STATSIG_CLIENT_KEY: ${{ secrets.VITE_STATSIG_CLIENT_KEY }}
          VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
